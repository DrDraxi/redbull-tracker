[project]
name = "redbull-api"
version = "0.1.0"
description = "Red Bull stock tracking API"
requires-python = ">=3.12"
dependencies = [
    "flask>=3.0",
    "gunicorn>=21.2",
    "itsdangerous>=2.1",
    "flask-limiter>=3.5",
    "pillow>=10.0",
    "anthropic>=0.40",
    "openai>=1.40",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-flask>=1.3",
    "ruff>=0.5",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
